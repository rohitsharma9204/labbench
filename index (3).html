<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bench — Test Catalog &amp; Reports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#2a2929; --ink-soft:#5b5957;
    --paper:#faf9f6; --panel:#ffffff;
    --line:#e4e0d9; --line-soft:#efece6;
    --brand:#d0392f; --brand-deep:#a82c24; --brand-wash:#fbeae7;
    --green:#2f7d5a; --green-wash:#e4f2ec;
    --amber:#b5761f; --amber-wash:#f8ecd9;
    --plum:#5b4b8a; --plum-wash:#ece7f6;
    --red:#a3402f; --red-wash:#fbe9e5;
    --focus:#d0392f; --radius:3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--paper); color:var(--ink); font-family:"Poppins",-apple-system,Segoe UI,sans-serif; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
  code,.mono{ font-family:"IBM Plex Mono",monospace; }
  a{ color:var(--brand-deep); }
  :focus-visible{ outline:2px solid var(--focus); outline-offset:2px; }
  button{ font-family:inherit; }

  /* ---- header / mode switch ---- */
  header.top{ background:var(--ink); color:#f4f2ea; border-bottom:3px solid var(--brand); }
  .top-inner{ max-width:1280px; margin:0 auto; padding:16px 28px; display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-logo{ height:34px; width:auto; display:block; background:#fff; border-radius:4px; padding:4px 8px; }
  .brand-divider{ width:1px; height:22px; background:#3d3b3a; }
  .brand-tag{ font-size:12.5px; color:#c7c3bd; letter-spacing:.03em; font-weight:500; }
  .mode-switch{ display:flex; border:1px solid #453f3c; border-radius:4px; overflow:hidden; }
  .mode-switch button{ border:none; background:transparent; color:#c7cfca; padding:9px 16px; font-size:13px; cursor:pointer; border-left:1px solid #453f3c; }
  .mode-switch button:first-child{ border-left:none; }
  .mode-switch button.active{ background:var(--brand); color:#fff; }
  .mode-switch button:hover:not(.active){ background:#3a3432; }
  .mode-tag{ font-size:11px; color:#b0a9a3; }

  main{ max-width:1280px; margin:0 auto; padding:22px 28px 70px; }

  /* ---- PIN gate ---- */
  .gate{ max-width:360px; margin:60px auto; background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:28px 26px; text-align:center; }
  .gate h2{ margin:0 0 6px; font-size:17px; }
  .gate p{ color:var(--ink-soft); font-size:12.5px; margin:0 0 18px; }
  .gate input{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:3px; font-size:15px; text-align:center; letter-spacing:.3em; font-family:"IBM Plex Mono",monospace; margin-bottom:10px; }
  .gate button{ width:100%; padding:10px; background:var(--brand); color:#fff; border:none; border-radius:3px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .gate button:hover{ background:var(--brand-deep); }
  .gate .hint{ margin-top:14px; font-size:11.5px; color:#8a8580; background:var(--paper); border:1px dashed var(--line); padding:8px; border-radius:3px; }
  .gate .err{ color:var(--red); font-size:12px; min-height:16px; margin-bottom:4px; }

  /* ---- controls bar (shared table controls) ---- */
  .controls{ background:var(--panel); border-bottom:1px solid var(--line); border-top:1px solid var(--line); position:sticky; top:0; z-index:5; margin:0 -28px 22px; padding:0 28px; }
  .controls-inner{ max-width:1280px; margin:0 auto; padding:14px 0; display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
  .search-wrap{ position:relative; flex:1 1 300px; max-width:480px; }
  .search-wrap input{ width:100%; padding:9px 12px 9px 34px; border:1px solid var(--line); border-radius:var(--radius); background:var(--paper); font-size:14px; font-family:inherit; color:var(--ink); }
  .search-wrap input:focus{ background:#fff; }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.45; }
  .seg{ display:flex; border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; }
  .seg button{ border:none; background:var(--panel); color:var(--ink-soft); padding:8px 13px; font-size:13px; cursor:pointer; border-left:1px solid var(--line); }
  .seg button:first-child{ border-left:none; }
  .seg button.active{ background:var(--brand); color:#fff; }
  .seg button:hover:not(.active){ background:var(--paper); }
  .result-count{ font-size:12.5px; color:var(--ink-soft); margin-left:auto; white-space:nowrap; }
  .subnav{ display:flex; gap:8px; margin-bottom:18px; }
  .subnav button{ border:1px solid var(--line); background:var(--panel); padding:8px 14px; border-radius:20px; font-size:13px; cursor:pointer; color:var(--ink-soft); }
  .subnav button.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .section-heading{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px; }
  .section-heading h2{ font-size:16px; margin:0; }
  .section-heading p{ margin:2px 0 0; font-size:12.5px; color:var(--ink-soft); }

  /* ---- table ---- */
  .table-wrap{ border:1px solid var(--line); border-radius:var(--radius); background:var(--panel); overflow:hidden; }
  table{ width:100%; border-collapse:collapse; }
  thead th{ text-align:left; font-weight:600; font-size:11.5px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:.04em; padding:10px 14px; border-bottom:1px solid var(--line); background:var(--line-soft); }
  /* Admin catalog always keeps every column visible; long values wrap instead of pushing Source/Report off-screen. */
  .admin-catalog-table{ table-layout:fixed; width:100%; }
  .admin-catalog-table th:nth-child(1), .admin-catalog-table td:nth-child(1){ width:8%; }
  .admin-catalog-table th:nth-child(2), .admin-catalog-table td:nth-child(2){ width:25%; }
  .admin-catalog-table th:nth-child(3), .admin-catalog-table td:nth-child(3){ width:20%; }
  .admin-catalog-table th:nth-child(4), .admin-catalog-table td:nth-child(4){ width:11%; }
  .admin-catalog-table th:nth-child(5), .admin-catalog-table td:nth-child(5){ width:9%; }
  .admin-catalog-table th:nth-child(6), .admin-catalog-table td:nth-child(6){ width:10%; }
  .admin-catalog-table th:nth-child(7), .admin-catalog-table td:nth-child(7){ width:17%; }
  .admin-catalog-table td.sample, .admin-catalog-table td.schedule, .admin-catalog-table td.tat{ white-space:normal; overflow-wrap:anywhere; }
  .admin-catalog-table td.code{ overflow-wrap:anywhere; }
  .admin-catalog-table td.name{ max-width:none; overflow-wrap:anywhere; }
  .admin-catalog-table td.reports{ overflow:hidden; }

  /* Client catalog: keep the Report column visible even after Show more.
     Fixed layout prevents long test/sample values from expanding the table. */
  .client-catalog-table{ table-layout:fixed; width:100%; }
  .client-catalog-table th:nth-child(1), .client-catalog-table td:nth-child(1){ width:8%; }
  .client-catalog-table th:nth-child(2), .client-catalog-table td:nth-child(2){ width:28%; }
  .client-catalog-table th:nth-child(3), .client-catalog-table td:nth-child(3){ width:20%; }
  .client-catalog-table th:nth-child(4), .client-catalog-table td:nth-child(4){ width:12%; }
  .client-catalog-table th:nth-child(5), .client-catalog-table td:nth-child(5){ width:10%; }
  .client-catalog-table th:nth-child(6), .client-catalog-table td:nth-child(6){ width:22%; }
  .client-catalog-table td.code, .client-catalog-table td.name, .client-catalog-table td.sample, .client-catalog-table td.schedule, .client-catalog-table td.tat{ overflow-wrap:anywhere; white-space:normal; }
  .client-catalog-table td.reports{ text-align:right; white-space:normal; overflow:hidden; }
  .client-catalog-table .catalog-report-actions{ justify-content:flex-end; flex-wrap:nowrap; }
  tbody tr{ border-bottom:1px solid var(--line-soft); cursor:pointer; transition:background .1s; }
  tbody tr:hover{ background:var(--brand-wash); }
  tbody tr.attached{ background:#fbfbf6; }
  tbody tr.attached:hover{ background:var(--brand-wash); }
  tbody td{ padding:10px 14px; vertical-align:top; }
  td.code{ font-family:"IBM Plex Mono",monospace; font-size:12.5px; color:var(--brand-deep); white-space:nowrap; }
  td.name{ font-weight:500; max-width:340px; }
  td.name .params{ display:block; font-weight:400; font-size:12px; color:var(--ink-soft); margin-top:2px; }
  td.sample, td.schedule{ color:var(--ink-soft); font-size:13px; white-space:nowrap; }
  td.tat{ white-space:nowrap; font-size:13px; }
  td.reports{ text-align:right; white-space:nowrap; }
  .badge{ display:inline-block; font-size:11px; font-weight:600; padding:2px 7px; border-radius:999px; }
  .badge.y{ background:var(--amber-wash); color:var(--amber); }
  .badge.n{ background:var(--green-wash); color:var(--green); }
  .badge.both{ background:var(--plum-wash); color:var(--plum); }
  .report-pill{ display:inline-flex; align-items:center; gap:5px; background:var(--brand); color:#fff; font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .catalog-report-actions{ display:flex; justify-content:flex-end; gap:6px; white-space:nowrap; }
  .catalog-report-actions .btn{ padding:6px 10px; font-size:11.5px; }
  .catalog-report-actions .btn.primary{ color:#fff; }
  .catalog-report-actions a{ text-decoration:none; }
  .empty-state{ padding:44px 20px; text-align:center; color:var(--ink-soft); }
  .empty-state .glyph{ font-size:24px; display:block; margin-bottom:8px; }
  .load-more-row td{ text-align:center; padding:14px; }
  .load-more{ border:1px solid var(--line); background:var(--panel); border-radius:var(--radius); padding:8px 18px; font-size:13px; cursor:pointer; color:var(--ink); }
  .load-more:hover{ background:var(--paper); }

  /* ---- slide-over admin panel ---- */
  .scrim{ position:fixed; inset:0; background:rgba(20,26,24,.4); opacity:0; pointer-events:none; transition:opacity .18s; z-index:20; }
  .scrim.open{ opacity:1; pointer-events:auto; }
  .panel{ position:fixed; top:0; right:0; height:100%; width:min(520px,100%); background:var(--panel); box-shadow:-8px 0 24px rgba(0,0,0,.12); transform:translateX(100%); transition:transform .2s ease; z-index:21; display:flex; flex-direction:column; }
  .panel.open{ transform:translateX(0); }
  .panel-head{ padding:20px 22px 16px; border-bottom:1px solid var(--line); position:relative; }
  .panel-head .pcode{ font-family:"IBM Plex Mono",monospace; color:var(--brand-deep); font-size:12.5px; }
  .panel-head h2{ margin:4px 0 0; font-size:18px; font-weight:600; line-height:1.3; padding-right:26px; }
  .panel-close{ position:absolute; top:16px; right:18px; border:none; background:none; font-size:20px; cursor:pointer; color:var(--ink-soft); padding:4px; }
  .panel-close:hover{ color:var(--ink); }
  .panel-body{ padding:18px 22px; overflow-y:auto; flex:1; }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px 16px; margin-bottom:6px; }
  .field-grid .full{ grid-column:1/-1; }
  .field .l{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:3px; }
  .field .v{ font-size:13.5px; }
  .field input, .field textarea{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; color:var(--ink); background:var(--paper); }
  .field textarea{ resize:vertical; min-height:52px; }
  .section-title{ font-size:12px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); margin:20px 0 10px; padding-top:16px; border-top:1px solid var(--line-soft); }
  .section-title:first-of-type{ border-top:none; padding-top:0; margin-top:0; }
  .save-row{ display:flex; justify-content:flex-end; margin-top:10px; }
  .btn{ border:1px solid var(--line); background:#fff; border-radius:3px; padding:7px 13px; font-size:12.5px; cursor:pointer; color:var(--ink); }
  .btn:hover{ background:var(--paper); }
  .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover{ background:var(--brand-deep); }
  .btn.danger:hover{ background:var(--red-wash); border-color:#e3b3a8; color:var(--red); }
  .save-flash{ font-size:12px; color:var(--brand-deep); margin-right:auto; align-self:center; opacity:0; transition:opacity .3s; }
  .save-flash.show{ opacity:1; }

  .dropzone{ border:1.5px dashed var(--line); border-radius:var(--radius); padding:18px 14px; text-align:center; color:var(--ink-soft); background:var(--paper); cursor:pointer; font-size:13px; display:block; }
  .dropzone.drag{ background:var(--brand-wash); border-color:var(--brand); color:var(--brand-deep); }
  .dropzone strong{ color:var(--brand-deep); font-weight:600; }
  .dropzone input{ display:none; }

  .report-list{ margin-top:12px; display:flex; flex-direction:column; gap:8px; }
  .report-item{ display:flex; align-items:center; gap:10px; border:1px solid var(--line); border-radius:var(--radius); padding:9px 10px; background:var(--paper); }
  .report-item .ricon{ width:30px; height:30px; flex:none; border-radius:3px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:700; }
  .report-item .rmeta{ flex:1; min-width:0; }
  .report-item .rname{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .report-item .rsub{ font-size:11px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .report-item .ract{ display:flex; gap:4px; flex:none; flex-wrap:wrap; justify-content:flex-end; }
  .report-item .ract button, .report-item .ract a button{ border:1px solid var(--line); background:#fff; border-radius:3px; padding:5px 8px; font-size:11px; cursor:pointer; color:var(--ink); }
  .report-item .ract button:hover{ background:var(--paper); }
  .report-item .ract button.danger:hover{ background:var(--red-wash); border-color:#e3b3a8; color:var(--red); }
  .no-reports{ font-size:12.5px; color:var(--ink-soft); padding:6px 2px; }
  .note{ font-size:12px; color:var(--ink-soft); background:var(--paper); border:1px solid var(--line-soft); border-radius:var(--radius); padding:9px 11px; margin-top:14px; }
  .attach-form{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:10px; }
  .attach-form .full{ grid-column:1/-1; }
  .attach-form label{ font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); display:block; margin-bottom:3px; }
  .attach-form input{ width:100%; padding:7px 9px; border:1px solid var(--line); border-radius:3px; font-family:inherit; font-size:13px; }

  /* ---- admin all-reports table ---- */
  .reports-table td, .reports-table th{ padding:9px 12px; }
  .reports-table td.name{ max-width:none; }

  /* ---- client hero / lookup ---- */
  .hero{ background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:32px 30px; margin-bottom:26px; }
  .hero .eyebrow-free{ font-size:12.5px; color:var(--brand-deep); font-weight:600; margin-bottom:6px; }
  .hero h2{ margin:0 0 6px; font-size:22px; font-weight:600; letter-spacing:-.01em; }
  .hero p{ margin:0 0 18px; color:var(--ink-soft); max-width:60ch; }
  .lookup-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .lookup-row input{ flex:1 1 260px; padding:11px 14px; border:1px solid var(--line); border-radius:4px; font-size:14px; font-family:inherit; }
  .lookup-row button{ padding:11px 20px; background:var(--brand); color:#fff; border:none; border-radius:4px; font-size:14px; font-weight:600; cursor:pointer; }
  .lookup-row button:hover{ background:var(--brand-deep); }
  .lookup-hint{ font-size:11.5px; color:var(--ink-soft); margin-top:8px; }

  .result-cards{ display:flex; flex-direction:column; gap:10px; margin-bottom:30px; }
  .result-card{ background:var(--panel); border:1px solid var(--line); border-radius:5px; padding:16px 18px; display:flex; align-items:center; gap:14px; cursor:pointer; }
  .result-card:hover{ border-color:var(--brand); background:var(--brand-wash); }
  .result-card .ricon{ width:38px; height:38px; flex:none; border-radius:5px; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:700; }
  .result-card .rmain{ flex:1; min-width:0; }
  .result-card .rname{ font-weight:600; font-size:14.5px; }
  .result-card .rsub{ font-size:12.5px; color:var(--ink-soft); margin-top:2px; }
  .result-card .rgo{ font-size:12.5px; color:var(--brand-deep); font-weight:600; white-space:nowrap; }
  .result-card .rdownload{ flex:none; }
  .result-card .rdownload button{ border:1px solid var(--line); background:#fff; border-radius:3px; padding:6px 12px; font-size:12px; cursor:pointer; color:var(--ink); }
  .result-card .rdownload button:hover{ background:var(--paper); }
  .catalog-report-actions{ display:flex; justify-content:flex-end; gap:6px; flex-wrap:wrap; }
  .catalog-report-actions .btn{ min-width:58px; }

  /* ---- printable report ---- */
  .report-view{ background:var(--panel); border:1px solid var(--line); border-radius:5px; overflow:hidden; }
  .report-view-bar{ display:flex; align-items:center; justify-content:space-between; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--line-soft); gap:10px; flex-wrap:wrap; }
  .report-view-bar .btn{ background:#fff; }
  #printArea{ padding:34px 40px; }
  .letterhead{ display:flex; justify-content:space-between; align-items:flex-start; border-bottom:3px solid var(--ink); padding-bottom:16px; margin-bottom:22px; }
  .letterhead .lh-logo{ height:30px; width:auto; display:block; }
  .letterhead .lh-note{ font-size:11px; color:var(--ink-soft); margin-top:6px; }
  .letterhead .lh-status{ text-align:right; font-size:11px; color:var(--ink-soft); }
  .report-meta-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px 20px; margin-bottom:26px; }
  .report-meta-grid .m .l{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--ink-soft); }
  .report-meta-grid .m .v{ font-size:14px; font-weight:500; margin-top:2px; }
  .report-test-block{ border:1px solid var(--line); border-radius:4px; padding:16px 18px; margin-bottom:20px; }
  .report-test-block h3{ margin:0 0 4px; font-size:15px; }
  .report-test-block .code{ font-family:"IBM Plex Mono",monospace; font-size:12px; color:var(--brand-deep); }
  .report-test-block .rows{ margin-top:12px; display:grid; grid-template-columns:repeat(3,1fr); gap:10px 20px; font-size:12.5px; }
  .report-test-block .rows .l{ color:var(--ink-soft); font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; }
  .pdf-frame-wrap{ border:1px solid var(--line); border-radius:4px; overflow:hidden; height:520px; }
  .pdf-frame-wrap iframe{ width:100%; height:100%; border:none; }
  .footnote{ margin-top:22px; font-size:11px; color:var(--ink-soft); border-top:1px solid var(--line-soft); padding-top:12px; }

  @media print{
    header.top, .controls, .subnav, .section-heading, .hero, .lookup-hint, .report-view-bar, .mode-switch{ display:none !important; }
    body, main{ background:#fff !important; padding:0 !important; margin:0 !important; }
    .report-view{ border:none; }
    #printArea{ padding:0; }
    .pdf-frame-wrap{ display:none; }
  }

  footer.site{ max-width:1280px; margin:0 auto; padding:0 28px 40px; color:var(--ink-soft); font-size:12px; }

  @media (max-width:720px){
    thead{ display:none; }
    tbody tr{ display:block; padding:10px 14px; }
    tbody td{ display:block; padding:2px 0; }
    td.reports{ text-align:left; margin-top:6px; }
    .catalog-report-actions{ justify-content:flex-start; }
    .panel{ width:100%; }
    .field-grid, .attach-form, .report-meta-grid, .report-test-block .rows{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<header class="top">

<script>
(function(){
  "use strict";

  var TESTS = JSON.parse(document.getElementById('test-data').textContent);
  var ADMIN_USER = "ROHIT.SHARMA";
  var ADMIN_PASSWORD = "Rohit@1003"; // owner fallback for this prototype
  var ADMIN_ROLE = sessionStorage.getItem('bench_admin_role') || '';
  var ADMIN_USERNAME = sessionStorage.getItem('bench_admin_user') || '';

  // ------------------------------------------------------------------
  // CENTRAL REPORT STORAGE (Supabase)
  // ------------------------------------------------------------------
  // Put your Supabase Project URL and anon/publishable key here.
  // Do NOT put a service_role/secret key in this HTML file.
  var SUPABASE_URL = 'https://fgmumzydezhxrozfqdep.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_0olDX5fly364ubFF9LCDcg_9M7-K7nj';
  var SUPABASE_BUCKET = 'dummy-reports';
  var supabaseClient = null;
  var remoteStorageReady = false;

  var LS_OVERRIDES = 'bench_overrides_v1';
  var LS_REPORTS = 'bench_reports_v2';
  var OLD_LS_REPORTS = 'bench_reports_v1';

  function loadJSON(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }
    catch(e){ console.error('storage save failed', e); return false; }
  }

  var overrides = loadJSON(LS_OVERRIDES, {});
  var reports = loadJSON(LS_REPORTS, null);
  if(!Array.isArray(reports)) reports = loadJSON(OLD_LS_REPORTS, []);

  function uid(){ return 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

  function supabaseConfigured(){
    return SUPABASE_URL.indexOf('PASTE_YOUR_') !== 0 &&
           SUPABASE_ANON_KEY.indexOf('PASTE_YOUR_') !== 0 &&
           window.supabase && typeof window.supabase.createClient === 'function';
  }

  function initRemoteStorage(){
    if(!supabaseConfigured()) return Promise.resolve(false);
    try{
      supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      remoteStorageReady = true;
      return Promise.resolve(true);
    }catch(e){
      console.error('Supabase initialization failed:', e);
      remoteStorageReady = false;
      return Promise.resolve(false);
    }
  }

  function publicReportUrl(path){
    if(!remoteStorageReady) return '';
    return supabaseClient.storage.from(SUPABASE_BUCKET).getPublicUrl(path).data.publicUrl || '';
  }

  function getBlobUrl(report){
    if(!report) return '';
    if(report.storagePath) return publicReportUrl(report.storagePath);
    // Compatibility with reports created by the old browser-only version.
    if(report.fileData) return report.fileData;
    return '';
  }

  function storeReportFile(rec, file){
    if(!remoteStorageReady) return Promise.reject(new Error('Supabase is not configured.'));
    var path = rec.id + '.pdf';
    return supabaseClient.storage.from(SUPABASE_BUCKET).upload(path, file, {
      contentType: 'application/pdf',
      upsert: false,
      cacheControl: '3600'
    }).then(function(result){
      if(result.error) throw result.error;
      rec.storagePath = path;
      rec.fileKey = path;
      return supabaseClient.from('reports').insert([{
        id: rec.id,
        test_code: rec.testCode,
        test_name: rec.testName,
        patient_name: rec.patientName || null,
        sample_id: rec.sampleId || null,
        report_date: rec.reportDate || null,
        file_name: rec.fileName,
        storage_path: path,
        added_at: new Date(rec.addedAt).toISOString()
      }]).select().single();
    }).then(function(result){
      if(result.error){
        return supabaseClient.storage.from(SUPABASE_BUCKET).remove([path]).then(function(){ throw result.error; });
      }
      return rec;
    });
  }

  function removeRemoteReport(report){
    if(!remoteStorageReady) return Promise.resolve();
    var path = report.storagePath || report.fileKey;
    var jobs = [supabaseClient.from('reports').delete().eq('id', report.id)];
    if(path) jobs.push(supabaseClient.storage.from(SUPABASE_BUCKET).remove([path]));
    return Promise.all(jobs).then(function(results){
      results.forEach(function(r){ if(r.error) throw r.error; });
    });
  }

  function hydrateReportFiles(){
    return initRemoteStorage().then(function(ready){
      if(!ready) return;
      return supabaseClient.from('reports').select('*').order('added_at', {ascending:false}).then(function(result){
        if(result.error) throw result.error;
        reports = (result.data || []).map(function(r){
          return {
            id: r.id,
            testCode: r.test_code,
            testName: r.test_name,
            patientName: r.patient_name || '',
            sampleId: r.sample_id || '',
            reportDate: r.report_date || '',
            fileName: r.file_name,
            fileKey: r.storage_path || '',
            storagePath: r.storage_path || '',
            addedAt: r.added_at ? new Date(r.added_at).getTime() : Date.now()
          };
        });
        saveJSON(LS_REPORTS, reports);
      });
    }).catch(function(err){
      console.error('Could not load reports from Supabase:', err);
      // Keep any previously cached metadata visible if the server is temporarily unavailable.
    });
  }

  function effectiveTest(t){
    var o = overrides[t.code] || {};
    return {
      code: t.code, name: t.name, params: t.params, outsource: t.outsource,
      sample: (o.sample !== undefined ? o.sample : t.sample),
      schedule: (o.schedule !== undefined ? o.schedule : t.schedule),
      tat: (o.tat !== undefined ? o.tat : t.tat),
      notes: o.notes || ''
    };
  }

  function reportsForCode(code){ return reports.filter(function(r){ return r.testCode === code; }); }

  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
  }
  function sha256(text){
    return crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function(buf){
      return Array.from(new Uint8Array(buf)).map(function(b){ return b.toString(16).padStart(2,'0'); }).join('');
    });
  }
  function badgeFor(outsource){
    if(outsource === 'Y') return '<span class="badge y">Outsourced</span>';
    if(outsource === 'Both') return '<span class="badge both">Both</span>';
    return '<span class="badge n">In-house</span>';
  }

  // ------------------------------------------------------------------
  // Routing: mode = client | admin ; admin gate via sessionStorage
  // ------------------------------------------------------------------
  var mode = (location.hash === '#admin') ? 'admin' : 'client';
  var adminAuthed = sessionStorage.getItem('bench_admin_ok') === '1';
  if(adminAuthed && !ADMIN_ROLE) ADMIN_ROLE = 'owner';
  function isOwner(){ return ADMIN_ROLE === 'owner'; }

  var app = document.getElementById('app');
  var footer = document.getElementById('siteFooter');

  document.getElementById('modeSwitch').addEventListener('click', function(e){
    var btn = e.target.closest('button'); if(!btn) return;
    setMode(btn.getAttribute('data-mode'));
  });

  function setMode(m){
    mode = m;
    location.hash = (m === 'admin') ? 'admin' : 'client';
    document.querySelectorAll('#modeSwitch button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-mode') === m);
    });
    render();
  }

  function render(){
    document.querySelectorAll('#modeSwitch button').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-mode') === mode);
    });
    if(mode === 'admin'){
      if(!adminAuthed){ renderGate(); return; }
      renderAdmin();
    } else {
      renderClient();
    }
  }

  function renderGate(){
    footer.textContent = '';
    app.innerHTML =
      '<div class="gate">' +
        '<h2>Admin sign-in</h2>' +
        '<p>Drxlabs staff only — enter your user ID and password to make changes and attach reports.</p>' +
        '<div class="err" id="gateErr"></div>' +
        '<input id="gateUser" type="text" autocomplete="username" placeholder="User ID">' +
        '<input id="gatePassword" type="password" autocomplete="current-password" placeholder="Password">' +
        '<button id="gateBtn">Sign in</button>' +
      '</div>';
    var user = document.getElementById('gateUser');
    var password = document.getElementById('gatePassword');
    var err = document.getElementById('gateErr');
    function tryEnter(){
      var enteredUser = user.value.trim();
      var enteredPassword = password.value;
      err.textContent = '';
      if(enteredUser === ADMIN_USER && enteredPassword === ADMIN_PASSWORD){
        adminAuthed = true; ADMIN_ROLE = 'owner'; ADMIN_USERNAME = enteredUser;
        sessionStorage.setItem('bench_admin_ok','1');
        sessionStorage.setItem('bench_admin_role','owner');
        sessionStorage.setItem('bench_admin_user',enteredUser);
        render();
        return;
      }
      if(!remoteStorageReady){ err.textContent = 'Team login is unavailable until Supabase is connected.'; return; }
      supabaseClient.from('team_members').select('username,password_hash,role,active').eq('username',enteredUser).maybeSingle().then(function(result){
        if(result.error) throw result.error;
        var member = result.data;
        return member ? sha256(enteredPassword).then(function(hash){ return {member:member, ok:member.active && hash === member.password_hash}; }) : {member:null,ok:false};
      }).then(function(check){
        if(check.ok){
          adminAuthed = true; ADMIN_ROLE = check.member.role || 'team'; ADMIN_USERNAME = check.member.username;
          sessionStorage.setItem('bench_admin_ok','1');
          sessionStorage.setItem('bench_admin_role',ADMIN_ROLE);
          sessionStorage.setItem('bench_admin_user',ADMIN_USERNAME);
          render();
        } else {
          err.textContent = 'Invalid user ID or password.'; password.value=''; password.focus();
        }
      }).catch(function(e){ console.error(e); err.textContent = 'Could not sign in. Please try again.'; });
    }
    document.getElementById('gateBtn').addEventListener('click', tryEnter);
    user.addEventListener('keydown', function(e){ if(e.key === 'Enter') password.focus(); });
    password.addEventListener('keydown', function(e){ if(e.key === 'Enter') tryEnter(); });
    user.focus();
  }

  // ------------------------------------------------------------------
  // ADMIN VIEW
  // ------------------------------------------------------------------
  var adminSub = 'catalog'; // catalog | reports
  var adminSearch = '', adminOutsource = 'all', adminAttached = 'all', adminShown = 60;

  function renderAdmin(){
    footer.innerHTML = remoteStorageReady ? 'Reports are stored centrally in Supabase and are available from any device/browser.' : 'Supabase is not configured yet. Add your project URL and anon key in the HTML to enable central report storage.';

    var totalOut = TESTS.filter(function(t){ return t.outsource==='Y' || t.outsource==='Both'; }).length;
    var totalReports = reports.length;

    app.innerHTML =
      '<div class="section-heading">' +
        '<div><h2>Admin</h2><p>' + TESTS.length.toLocaleString() + ' tests in catalog · ' + totalOut.toLocaleString() + ' outsourced · ' + totalReports.toLocaleString() + ' reports on file</p></div>' +
        '<div style="display:flex;align-items:center;gap:10px;"><span class="badge both">' + escapeHtml(isOwner() ? 'Owner' : 'Team Member') + '</span><button class="btn" id="lockBtn">Sign out</button></div>' +
      '</div>' +
      '<div class="subnav">' +
        '<button data-s="catalog" class="' + (adminSub==='catalog'?'active':'') + '">Test catalog</button>' +
        '<button data-s="reports" class="' + (adminSub==='reports'?'active':'') + '">All reports (' + totalReports + ')</button>' +
        (isOwner() ? '<button data-s="team" class="' + (adminSub==='team'?'active':'') + '">Team members</button>' : '') +
      '</div>' +
      '<div id="adminSubContent"></div>';

    document.getElementById('lockBtn').addEventListener('click', function(){
      adminAuthed = false; ADMIN_ROLE=''; ADMIN_USERNAME=''; sessionStorage.removeItem('bench_admin_ok'); sessionStorage.removeItem('bench_admin_role'); sessionStorage.removeItem('bench_admin_user'); setMode('client');
    });
    app.querySelector('.subnav').addEventListener('click', function(e){
      var b = e.target.closest('button'); if(!b) return;
      adminSub = b.getAttribute('data-s');
      renderAdmin();
    });

  function debounce(fn, ms){ var t; return function(){ var a=arguments; clearTimeout(t); t=setTimeout(function(){ fn.apply(null,a); }, ms); }; }

  function adminMatches(t){
    if(adminOutsource !== 'all' && t.outsource !== adminOutsource) return false;
    var has = reportsForCode(t.code).length > 0;
    if(adminAttached === 'with' && !has) return false;
    if(adminAttached === 'without' && has) return false;
    if(adminSearch){
      var hay = (t.code + ' ' + t.name + ' ' + t.params).toLowerCase();
      if(hay.indexOf(adminSearch) === -1) return false;
    }
    return true;
  }

  function renderAdminTable(){
    var body = document.getElementById('aBody');
    var countEl = document.getElementById('aCount');
    if(!body) return;
    var filtered = TESTS.filter(adminMatches);
    var slice = filtered.slice(0, adminShown);
    if(countEl) countEl.textContent = filtered.length.toLocaleString() + ' of ' + TESTS.length.toLocaleString() + ' tests';

    if(filtered.length === 0){
      body.innerHTML = '<tr><td colspan="7"><div class="empty-state"><span class="glyph">&empty;</span>No tests match your filters.</div></td></tr>';
      return;
    }

    var html = slice.map(function(base){
      var t = effectiveTest(base);
      var count = reportsForCode(t.code).length;
      var paramsHtml = t.params ? '<span class="params">' + escapeHtml(t.params) + '</span>' : '';
      return '<tr data-code="' + t.code + '" class="' + (count ? 'attached' : '') + '">' +
        '<td class="code">' + t.code + '</td>' +
        '<td class="name">' + escapeHtml(t.name) + paramsHtml + '</td>' +
        '<td class="sample">' + escapeHtml(t.sample) + '</td>' +
        '<td class="schedule">' + escapeHtml(t.schedule) + '</td>' +
        '<td class="tat">' + escapeHtml(t.tat) + '</td>' +
        '<td>' + badgeFor(t.outsource) + '</td>' +
        '<td class="reports">' + (count ? '<span class="report-pill">' + count + ' attached</span>' : '<span style="color:var(--ink-soft);font-size:12px;">— add —</span>') + '</td>' +
      '</tr>';
    }).join('');

    if(filtered.length > adminShown){
      html += '<tr class="load-more-row"><td colspan="7"><button class="load-more" id="aLoadMore">Show more (' + (filtered.length - adminShown).toLocaleString() + ' remaining)</button></td></tr>';

    body.innerHTML = html;

    var lm = document.getElementById('aLoadMore');
    if(lm) lm.addEventListener('click', function(){ adminShown += 60; renderAdminTable(); });

      row.addEventListener('click', function(){ openAdminPanel(row.getAttribute('data-code')); });

      '<div class="section-title">Attach a dummy report</div>' +
      '<div class="attach-form">' +
        '<div><label>Patient name</label><input id="fPatient" placeholder="e.g. Jane Doe"></div>' +
        '<div><label>Sample / report ID</label><input id="fSampleId" placeholder="e.g. SMP-10234"></div>' +
        '<div class="full"><label>Report date</label><input id="fDate" type="date"></div>' +
      '</div>' +
      '<label class="dropzone" id="dropzone">' +
        '<input type="file" id="fileInput" accept="application/pdf">' +
        '<span><strong>Click to attach</strong> or drag a dummy report PDF here</span>' +
      '</label>' +
      '<div id="attachErr" style="color:var(--red); font-size:12px; margin-top:6px;"></div>' +

      '<div class="section-title">Reports on file for this test</div>' +
      '<div class="report-list" id="reportList"></div>' +
      '<div class="note">Attached PDFs are stored centrally in Supabase when configured, so they can be opened from other devices and browsers.</div>';

    document.getElementById('saveDetails').addEventListener('click', function(){
      overrides[t.code] = {
        sample: document.getElementById('fSample').value,
        schedule: document.getElementById('fSchedule').value,
        tat: document.getElementById('fTat').value,
        notes: document.getElementById('fNotes').value
      };
      saveJSON(LS_OVERRIDES, overrides);
      var flash = document.getElementById('saveFlash');
      flash.classList.add('show');
      setTimeout(function(){ flash.classList.remove('show'); }, 1400);
    });

    var dropzone = document.getElementById('dropzone');
    var fileInput = document.getElementById('fileInput');
    dropzone.addEventListener('dragover', function(e){ e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', function(){ dropzone.classList.remove('drag'); });
    dropzone.addEventListener('drop', function(e){ e.preventDefault(); dropzone.classList.remove('drag'); handleFile(e.dataTransfer.files[0]); });
    fileInput.addEventListener('change', function(e){ handleFile(e.target.files[0]); });

    function handleFile(file){
      var errEl = document.getElementById('attachErr');
      errEl.textContent = '';
      if(!file) return;
      if(file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)){
        errEl.textContent = 'Please choose a PDF file.'; return;
      }
      if(file.size > 4 * 1024 * 1024){
        errEl.textContent = 'That file is over 4MB — browser storage has limited room. Try a smaller dummy PDF.'; return;
      }
      var rec = {
        id: uid(),
        testCode: t.code,
        testName: t.name,
        patientName: document.getElementById('fPatient').value.trim(),
        sampleId: document.getElementById('fSampleId').value.trim(),
        reportDate: document.getElementById('fDate').value,
        fileName: file.name,
        fileKey: '',
        addedAt: Date.now()
      };
      errEl.textContent = 'Saving PDF…';
      storeReportFile(rec, file).then(function(){
        reports.push(rec);
        saveJSON(LS_REPORTS, reports);
        fileInput.value = '';
        errEl.textContent = '';
        renderReportList();
        if(mode === 'client') renderClient();
      }).catch(function(err){
        console.error('Could not save attached PDF:', err);
        errEl.textContent = (err && err.message) ? 'Could not save the PDF: ' + err.message : 'Could not save the PDF.';
      });
    }

    renderReportList();
    scrim.classList.add('open');
    panel.classList.add('open');
  }

    var catShown = 40, catSearch = '';
    function renderCatTable(){
      var filtered = TESTS.filter(function(t){

      }
      var html = slice.map(function(base){
        var t = effectiveTest(base);

         var reportActions = attached.length
? '<div class="catalog-report-actions"><button class="btn report-view-btn" data-report-id="' + escapeHtml(attached[0].id) + '">View</button><a class="catalog-report-download" data-report-id="' + escapeHtml(attached[0].id) + '" download="' + escapeHtml(attached[0].fileName) + '"><button class="btn primary" type="button">Download</button></a></div>'
           : '<span style="font-size:12px;color:var(--ink-soft);">Pending upload</span>';
         return '<tr><td class="code">' + t.code + '</td><td class="name">' + escapeHtml(t.name) + '</td><td class="sample">' + escapeHtml(t.sample) + '</td><td class="schedule">' + escapeHtml(t.schedule) + '</td><td class="tat">' + escapeHtml(t.tat) + '</td><td class="reports">' + reportActions + '</td></tr>';
      }).join('');
      if(filtered.length > catShown){
        html += '<tr class="load-more-row"><td colspan="6"><button class="load-more" id="cCatMore">Show more</button></td></tr>';
      }
      body.innerHTML = html;

      // Attached reports: wire View + Download to the real stored PDF.
      body.querySelectorAll('.report-view-btn').forEach(function(btn){
        btn.addEventListener('click', function(e){
          e.preventDefault();
          e.stopPropagation();
          var r = reports.find(function(x){ return x.id === btn.getAttribute('data-report-id'); });
          if(!r) return;
          var url = getBlobUrl(r);
          if(url) window.open(url, '_blank');
          else alert('This attached report could not be opened. Please attach the PDF again from Admin.');
        });
      });

      body.querySelectorAll('.catalog-report-download').forEach(function(link){
        var r = reports.find(function(x){ return x.id === link.getAttribute('data-report-id'); });

      if(more) more.addEventListener('click', function(){ catShown += 40; renderCatTable(); });

  function renderClientResults(){

    if(!clientQuery){
      resultsEl.innerHTML = '';
      hintEl.textContent = reports.length ? '' : 'No dummy reports have been attached yet — ask an admin to attach one first.';
      return;

    var q = clientQuery.toLowerCase();
    var matches = reports.filter(function(r){
      var hay = (r.sampleId + ' ' + r.patientName + ' ' + r.testCode + ' ' + r.testName).toLowerCase();
      return hay.indexOf(q) !== -1;
    });
    hintEl.textContent = '';
    if(matches.length === 0){
      resultsEl.innerHTML = '<div class="table-wrap"><div class="empty-state"><span class="glyph">&empty;</span>No report found for "' + escapeHtml(clientQuery) + '". Check the ID or name and try again.</div></div>';
      return;
    }
    resultsEl.innerHTML = '<div class="result-cards">' + matches.map(function(r){
      var sub = [r.sampleId, r.patientName, r.reportDate].filter(Boolean).join(' · ');
      return '<div class="result-card" data-id="' + r.id + '">' +
        '<div class="ricon">PDF</div>' +
        '<div class="rmain"><div class="rname">' + escapeHtml(r.testName) + '</div><div class="rsub">' + escapeHtml(sub) + '</div></div>' +
        '<a class="rdownload" data-id="' + r.id + '" download="' + escapeHtml(r.fileName) + '"><button type="button" class="btn">Download</button></a>' +
        '<div class="rgo">View &amp; print &rarr;</div>' +
      '</div>';
    }).join('') + '</div>';
    resultsEl.querySelectorAll('.result-card').forEach(function(card){
      card.addEventListener('click', function(){
        clientOpenReportId = card.getAttribute('data-id');
        renderClient();
      });
    });
    resultsEl.querySelectorAll('.rdownload').forEach(function(link){
      // set the real blob URL just before it's needed, and don't trigger the card's open-report click
      link.addEventListener('click', function(e){ e.stopPropagation(); });
      var r = matches.find(function(x){ return x.id === link.getAttribute('data-id'); });
      if(r) link.setAttribute('href', getBlobUrl(r));
    });
  }

  function pdfEscape(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)'); }

  function getDummyReportUrl(t){
    var lines = [
      'RX-DX Bench - DUMMY REPORT',
      'FOR QA / DEMO USE ONLY',
      '',
      'Patient: DEMO PATIENT',
      'Sample / Report ID: DEMO-' + t.code,
      'Report Date: ' + new Date().toLocaleDateString(),
      '',
      'Test: ' + t.name,
      'Code: ' + t.code,
      'Sample Type: ' + t.sample,
      'Schedule: ' + t.schedule,
      'Reporting TAT: ' + t.tat,
      '',
      'Result: DEMO / QA ONLY',
      '',
      'This is a dummy report generated for demo/testing purposes.',
      'It does not reflect real patient data.'
    ];
    var content = 'BT\n/F1 11 Tf\n50 760 Td\n';
    lines.forEach(function(line, i){
      if(i) content += '0 -18 Td\n';
      content += '(' + pdfEscape(line) + ') Tj\n';
    });
    var objects = [];
    objects.push('<< /Type /Catalog /Pages 2 0 R >>');
    objects.push('<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    objects.push('<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 5 0 R >> >> /Contents 4 0 R >>');
    objects.push('<< /Length ' + content.length + ' >>\nstream\n' + content + 'ET\nendstream');
    objects.push('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>');
    var pdf = '%PDF-1.4\n';
    var offsets = [0];
    objects.forEach(function(obj, i){ offsets[i+1] = pdf.length; pdf += (i+1) + ' 0 obj\n' + obj + '\nendobj\n'; });
    var xref = pdf.length;
    pdf += 'xref\n0 ' + (objects.length+1) + '\n0000000000 65535 f \n';
    for(var j=1;j<=objects.length;j++) pdf += String(offsets[j]).padStart(10,'0') + ' 00000 n \n';
    pdf += 'trailer\n<< /Size ' + (objects.length+1) + ' /Root 1 0 R >>\nstartxref\n' + xref + '\n%%EOF';
    return URL.createObjectURL(new Blob([pdf], {type:'application/pdf'}));
  }

  function openDummyReport(t){
    var url = getDummyReportUrl(t);
    window.open(url, '_blank');
  }
